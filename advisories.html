<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional Advisories | Curriculum &amp; Learning Management Division - DepEd Region XII</title>
  <meta name="description" content="Searchable repository of regional advisories of DepEd Regional Office XII CLMD.">
  <link rel="icon" href="assets/images/icons/clmd-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="Advisories">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="no-print"></header>

  <section class="hero" style="min-height:auto;padding:5rem 0;background:linear-gradient(135deg,var(--violet-deep),var(--violet),var(--violet-light))">
    <div class="hero-overlay" style="background:linear-gradient(135deg,rgba(42,18,69,.4),rgba(91,45,142,.6))"></div>
    <div class="container hero-content text-center">
      <span class="hero-badge"><i class="bi bi-megaphone"></i> Official Notices</span>
      <h1 class="mt-3">Regional Advisories</h1>
      <p class="lead mx-auto" style="max-width:660px">Official notices and announcements issued by DepEd Regional Office XII.</p>
    </div>
  </section>

  <main id="main" class="section">
    <div class="container">
      <div class="glass p-4 mb-4" data-aos="fade-up">
        <div class="search-bar mb-3">
          <i class="bi bi-search"></i>
          <input type="text" id="advSearch" placeholder="Search by title, advisory number, or keyword..." aria-label="Search advisories">
        </div>
        <div class="row g-3">
          <div class="col-md-6 col-lg-3"><label class="form-label">Year</label><select class="form-select" id="fYear"><option value="All">All Years</option></select></div>
          <div class="col-md-6 col-lg-3"><label class="form-label">Learning Area</label><select class="form-select" id="fArea"><option value="All">All Areas</option></select></div>
          <div class="col-md-6 col-lg-3"><label class="form-label">Program</label><select class="form-select" id="fProgram"><option value="All">All Programs</option></select></div>
          <div class="col-md-6 col-lg-3 d-flex align-items-end"><button class="btn btn-violet w-100" onclick="clearFilters()"><i class="bi bi-x-circle me-1"></i>Clear Filters</button></div>
        </div>
      </div>
      <div id="advList" data-aos="fade-up"></div>
      <div class="text-center muted mt-4" id="advEmpty" style="display:none">No advisories match your filters.</div>
    </div>
  </main>

  <div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content" style="border-radius:1.2rem">
        <div class="modal-header" style="background:linear-gradient(90deg,var(--violet),var(--violet-light));color:#fff">
          <h5 class="modal-title" id="pdfTitle">Document Preview</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="height:75vh"><iframe id="pdfFrame" src="" style="width:100%;height:100%;border:none;border-radius:.8rem" title="PDF viewer"></iframe></div>
        <div class="modal-footer">
          <button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
          <button class="btn btn-violet btn-sm" onclick="window.CLMD.toast('success','Downloading document (demo)...')"><i class="bi bi-download me-1"></i>Download</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    let M=[], state={q:"",year:"All",area:"All",program:"All"};
    function render(){
      const list=M.filter(m =>
        (state.year==="All" || m.year===+state.year) &&
        (state.area==="All" || m.area===state.area) &&
        (state.program==="All" || m.program===state.program) &&
        (m.title+" "+m.no+" "+m.keywords+" "+m.program+" "+m.area).toLowerCase().includes(state.q.toLowerCase()));
      document.getElementById("advEmpty").style.display=list.length?"none":"block";
      document.getElementById("advList").innerHTML = list.length ? list.map(m=>`
        <div class="card-g repo-item mb-3 hover-lift d-flex flex-wrap align-items-center gap-3" id="adv-${m.no.replace(/\s/g,"-")}">
          <div class="flex-grow-1" style="min-width:260px">
            <div class="mno">${m.no}</div>
            <div class="mtitle">${m.title}</div>
            <small class="muted">${m.date} · <strong>${m.area}</strong> · ${m.program}</small><br>
            <span class="badge-tag small mt-1">Issued to: ${m.issuedTo}</span>
          </div>
          <div class="d-flex gap-2 ms-auto">
            <button class="btn btn-ghost btn-sm" onclick="openPDF('${m.no}','${m.title}')"><i class="bi bi-eye me-1"></i>View</button>
            <button class="btn btn-violet btn-sm" onclick="window.CLMD.toast('success','Downloading ${m.no} (demo)...')"><i class="bi bi-download me-1"></i>Download</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="share('${m.title}')"><i class="bi bi-share me-1"></i>Share</button>
          </div>
        </div>`).join("") : "";
    }
    function openPDF(no,title){ document.getElementById("pdfTitle").textContent=no; document.getElementById("pdfFrame").src="assets/pdf/sample.pdf"; new bootstrap.Modal(document.getElementById("pdfModal")).show(); }
    function share(title){ if(navigator.share){ navigator.share({title,url:location.href}).catch(()=>{}); } else { window.CLMD.toast("info","Share link: "+location.href); } }
    function clearFilters(){ state={q:"",year:"All",area:"All",program:"All"}; document.getElementById("advSearch").value=""; document.getElementById("fYear").value="All"; document.getElementById("fArea").value="All"; document.getElementById("fProgram").value="All"; render(); }
    fetch("assets/data/advisories.json").then(r=>r.json()).then(d=>{
      M=d.items;
      const years=[...new Set(M.map(m=>m.year))].sort().reverse();
      const areas=[...new Set(M.map(m=>m.area))];
      const programs=[...new Set(M.map(m=>m.program))];
      document.getElementById("fYear").innerHTML='<option value="All">All Years</option>'+years.map(y=>`<option>${y}</option>`).join("");
      document.getElementById("fArea").innerHTML='<option value="All">All Areas</option>'+areas.map(a=>`<option>${a}</option>`).join("");
      document.getElementById("fProgram").innerHTML='<option value="All">All Programs</option>'+programs.map(p=>`<option>${p}</option>`).join("");
      render();
    });
    document.getElementById("advSearch").addEventListener("input",e=>{state.q=e.target.value;render();});
    document.getElementById("fYear").onchange=e=>{state.year=e.target.value;render();};
    document.getElementById("fArea").onchange=e=>{state.area=e.target.value;render();};
    document.getElementById("fProgram").onchange=e=>{state.program=e.target.value;render();};
  </script>
</body>
</html>
