<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Center | Curriculum &amp; Learning Management Division - DepEd Region XII</title>
  <meta name="description" content="Download curriculum guides, learning resources, memoranda, advisories, forms, templates, reports, and manuals from CLMD DepEd Region XII.">
  <link rel="icon" href="assets/images/icons/clmd-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="Downloads">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="no-print"></header>

  <section class="hero" style="min-height:auto;padding:5rem 0;background:linear-gradient(135deg,var(--violet-deep),var(--violet),var(--violet-light))">
    <div class="hero-overlay" style="background:linear-gradient(135deg,rgba(42,18,69,.4),rgba(91,45,142,.6))"></div>
    <div class="container hero-content text-center">
      <span class="hero-badge"><i class="bi bi-download"></i> Resources</span>
      <h1 class="mt-3">Download Center</h1>
      <p class="lead mx-auto" style="max-width:660px">Curriculum guides, learning resources, official communications, forms, templates, reports, and manuals.</p>
      <div class="search-bar mx-auto mt-4" style="max-width:560px">
        <i class="bi bi-search"></i>
        <input type="text" id="dlSearch" placeholder="Search downloadable files..." aria-label="Search downloads">
      </div>
    </div>
  </section>

  <main id="main" class="section">
    <div class="container">
      <div class="d-flex flex-wrap gap-2 mb-4" id="catFilters" data-aos="fade-up"></div>
      <div class="row g-3" id="dlList" data-aos="fade-up"></div>
      <div class="text-center muted mt-4" id="dlEmpty" style="display:none">No files match your filters.</div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    let D={items:[],categories:[]}, activeCat="All", q="";
    function render(){
      const list = D.items.filter(i => (activeCat==="All" || i.category===activeCat) && (i.name+" "+i.desc+" "+i.category).toLowerCase().includes(q.toLowerCase()));
      document.getElementById("dlEmpty").style.display = list.length?"none":"block";
      document.getElementById("dlList").innerHTML = list.map(i=>`
        <div class="col-md-6 col-lg-4">
          <div class="card-g repo-item hover-lift d-flex flex-column h-100">
            <div class="d-flex gap-3 align-items-start">
              <div class="ic" style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-light))"><i class="bi ${i.icon}"></i></div>
              <div class="flex-grow-1">
                <h6 class="mb-1">${i.name}</h6>
                <p class="muted small mb-1">${i.desc}</p>
                <span class="badge-tag small">${i.category}</span>
                <span class="muted small ms-2"><i class="bi bi-file-earmark me-1"></i>${i.type} · ${i.size}</span>
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-ghost btn-sm flex-fill" onclick="window.CLMD.toast('info','Opening preview for '+ '${i.name}'+'...')"><i class="bi bi-eye me-1"></i>Preview</button>
              <button class="btn btn-gold btn-sm flex-fill" onclick="downloadFile('${i.name}')"><i class="bi bi-download me-1"></i>Download</button>
            </div>
          </div>
        </div>`).join("");
      window.AOS.refresh && window.AOS.refresh();
    }
    function downloadFile(name){ window.CLMD.toast("success", name + " download started (demo)."); }
    fetch("assets/data/downloads.json").then(r=>r.json()).then(d=>{
      D=d;
      document.getElementById("catFilters").innerHTML = `<button class="filter-btn active" data-cat="All">All (${d.items.length})</button>` + d.categories.map(c=>`<button class="filter-btn" data-cat="${c}">${c}</button>`).join("");
      document.querySelectorAll("#catFilters .filter-btn").forEach(b=>b.onclick=()=>{ activeCat=b.dataset.cat; document.querySelectorAll("#catFilters .filter-btn").forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(); });
      render();
    });
    document.getElementById("dlSearch").addEventListener("input", e=>{ q=e.target.value; render(); });
  </script>
</body>
</html>
