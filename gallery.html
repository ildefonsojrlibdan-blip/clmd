<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery | Curriculum &amp; Learning Management Division - DepEd Region XII</title>
  <meta name="description" content="Photo gallery of CLMD programs, events, and activities across DepEd Region XII.">
  <link rel="icon" href="assets/images/icons/clmd-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="Gallery">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="no-print"></header>

  <section class="hero" style="min-height:auto;padding:5rem 0;background:linear-gradient(135deg,var(--violet-deep),var(--violet),var(--violet-light))">
    <div class="hero-overlay" style="background:linear-gradient(135deg,rgba(42,18,69,.4),rgba(91,45,142,.6))"></div>
    <div class="container hero-content text-center">
      <span class="hero-badge"><i class="bi bi-images"></i> Gallery</span>
      <h1 class="mt-3">Photo Gallery</h1>
      <p class="lead mx-auto" style="max-width:620px">Moments that define our journey in transforming learning across Region XII.</p>
    </div>
  </section>

  <main id="main" class="section">
    <div class="container">
      <div class="glass p-3 mb-4" data-aos="fade-up">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <label class="form-label mb-0 me-1"><i class="bi bi-filter me-1"></i>Program:</label>
          <select class="form-select form-select-sm d-inline-block w-auto" id="fProgram"><option value="All">All Programs</option></select>
          <label class="form-label mb-0 ms-3 me-1">Year:</label>
          <select class="form-select form-select-sm d-inline-block w-auto" id="fYear"><option value="All">All Years</option></select>
          <label class="form-label mb-0 ms-3 me-1">Division:</label>
          <select class="form-select form-select-sm d-inline-block w-auto" id="fDivision"><option value="All">All Divisions</option></select>
          <label class="form-label mb-0 ms-3 me-1">Event:</label>
          <select class="form-select form-select-sm d-inline-block w-auto" id="fEvent"><option value="All">All Events</option></select>
        </div>
      </div>
      <div class="row g-3" id="gallery" data-aos="fade-up"></div>
      <div class="text-center muted mt-4" id="galEmpty" style="display:none">No photos match your filters.</div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    let D={items:[],categories:[]}, st={program:"All",year:"All",division:"All",event:"All"};
    function render(){
      const list=D.items.filter(g =>
        (st.program==="All"||g.program===st.program) && (st.year==="All"||g.year===+st.year) &&
        (st.division==="All"||g.division===st.division) && (st.event==="All"||g.event===st.event));
      document.getElementById("galEmpty").style.display=list.length?"none":"block";
      document.getElementById("gallery").innerHTML = list.map(g=>`
        <div class="col-6 col-md-4 col-lg-3" data-aos="zoom-in">
          <div class="gallery-item hover-lift">
            <img src="${g.img}" alt="${g.title}" data-lightbox="${g.img}" data-caption="${g.title} · ${g.program} · ${g.year}" loading="lazy">
            <div class="overlay"><h5>${g.title}</h5><small style="color:#ddd">${g.division} · ${g.year}</small></div>
          </div>
        </div>`).join("");
      window.CLMD.initLightbox(document.getElementById("gallery"));
    }
    fetch("assets/data/gallery.json").then(r=>r.json()).then(d=>{
      D=d;
      const programs=[...new Set(d.items.map(g=>g.program))];
      const years=[...new Set(d.items.map(g=>g.year))].sort().reverse();
      const divisions=[...new Set(d.items.map(g=>g.division))];
      const events=[...new Set(d.items.map(g=>g.event))];
      document.getElementById("fProgram").innerHTML='<option value="All">All Programs</option>'+programs.map(p=>`<option>${p}</option>`).join("");
      document.getElementById("fYear").innerHTML='<option value="All">All Years</option>'+years.map(y=>`<option>${y}</option>`).join("");
      document.getElementById("fDivision").innerHTML='<option value="All">All Divisions</option>'+divisions.map(d=>`<option>${d}</option>`).join("");
      document.getElementById("fEvent").innerHTML='<option value="All">All Events</option>'+events.map(e=>`<option>${e}</option>`).join("");
      render();
    });
    ["fProgram","fYear","fDivision","fEvent"].forEach(id=>document.getElementById(id).onchange=e=>{st[id.replace("f","").toLowerCase()==="program"?"program":id.replace("f","").toLowerCase()==="year"?"year":id.replace("f","").toLowerCase()==="division"?"division":"event"]=e.target.value;render();});
  </script>
</body>
</html>
